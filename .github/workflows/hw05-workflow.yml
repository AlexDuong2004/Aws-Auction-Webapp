# This yaml only pushes the code to the existing lambda. You must create
#  the lambda function(s) in the AWS Console first, before triggering the pipeline. 
# Source:  https://www.whitespectre.com/ideas/multiple-aws-lambda-deployment-with-github-actions/
on:
  push:
    branches:
      - main
      - feature-hw05
    paths:
      - hw05/**

jobs:
  test:
    name: Run Pytest for Lambda
     # Your repo MUST be in a UConn GitHub Organization that has been configured with RH Runners. 
    # This is a manual task that needs to be completed by the UConn School of Business IT staff.
    # The runs-on value must be "self-hosted" to leverage the runner .
    runs-on: self-hosted

    steps:
      - name: Checkout the files
        uses: actions/checkout@v2

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Install pytest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
      - name: Run all your pytest tests
        run: pytest hw05/test_api_05.py  

  deploy:
    name: Deploy lambda code for S3 trigger
    needs: test  # Ensures deployment only happens if tests pass
    runs-on: self-hosted

    steps:
      - name: Checkout the files
        uses: actions/checkout@v2
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Zip python code 1
        run: zip -j hw05_1-code.zip ./hw05/List_buckets.py

      - name: Deploy python code to lambda 1
        run: aws lambda update-function-code --function-name hw05-ald21039-list --zip-file fileb://hw05_1-code.zip

      - name: Zip python code 2
        run: zip -j hw05_2-code.zip ./hw05/List_objects.py

      - name: Deploy python code to lambda 2
        run: aws lambda update-function-code --function-name hw05-ald21039-bucket --zip-file fileb://hw05_2-code.zip
      
      - name: Zip python code 3
        run: zip -j hw05_3-code.zip ./hw05/upload.py

      - name: Deploy python code to lambda 3
        run: aws lambda update-function-code --function-name hw05-ald21039-upload --zip-file fileb://hw05_3-code.zip

      - name: Zip python code 4
        run: zip -j hw05_4-code.zip ./hw05/delete.py

      - name: Deploy python code to lambda 4
        run: aws lambda update-function-code --function-name hw05-ald21039-delete --zip-file fileb://hw05_4-code.zip

