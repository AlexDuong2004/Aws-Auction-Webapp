<html>
<head>
    <title>Uploaded Files</title>
</head>
<body>
    <h1>Uploaded Files</h1>
    <table border="1">
        <thead>
            <tr>
                <th>File Name</th>
                <th>File Size (Bytes)</th>
                <th>Date Modified</th>
            </tr>
        </thead>
        <tbody>
            {% for file in files %}
            <tr>
                <td><a href="{{ file.url }}" target="_blank">{{ file.name }}</a></td>
                <td>{{ file.size }}</td>
                <td>{{ file.modified_date }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
